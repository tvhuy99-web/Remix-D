name: Apply complete replacement

on:
  push:
    branches:
      - agent/full-replace-upload
    paths:
      - .payload-v11/READY

permissions:
  contents: write

concurrency:
  group: complete-replacement-main
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out replacement carrier branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-replace-upload
          fetch-depth: 0

      - name: Assemble and verify binary patch
        shell: bash
        run: |
          set -euo pipefail
          cat .payload-v11/part-* | base64 --decode > /tmp/source.patch.zst
          echo "90e9ce868169c8992f269461b6699c1da3b4b9838132be3c29bbb634467987da  /tmp/source.patch.zst" | sha256sum --check

      - name: Reconstruct replacement source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "46010bf28bf38095b271f9889efab43f7b2f9d67"
          git checkout -B main origin/main
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --exclude=.git --exclude='./dist' --exclude='./dist/**' \
            --exclude='./audit/blackbox-1.2.0/asset-production.js' \
            -cf /tmp/current-source.tar .
          echo "381d0273f778e7f9eafe2a6550fef8a2ae46ddf46b0d9b78ee731872cae0108b  /tmp/current-source.tar" | sha256sum --check
          zstd --decompress --patch-from=/tmp/current-source.tar \
            /tmp/source.patch.zst -o /tmp/target-source.tar
          echo "60225160760c8c2323454457b64d4ead3e7a2914706b4a801d6449b0ee4b74a3  /tmp/target-source.tar" | sha256sum --check
          mkdir -p /tmp/replacement-tree
          tar -xf /tmp/target-source.tar -C /tmp/replacement-tree
          test "$(find /tmp/replacement-tree -type f | wc -l)" -eq 232

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: /tmp/replacement-tree/package-lock.json

      - name: Build exact replacement tree
        shell: bash
        working-directory: /tmp/replacement-tree
        run: |
          set -euo pipefail
          npm ci
          npm run build
          zstd --decompress --patch-from=dist/assets/index-B4erEXO1.js \
            .replacement-internal/audit.patch.zst \
            -o audit/blackbox-1.2.0/asset-production.js
          rm -rf node_modules .replacement-internal
          test "$(find . -type f | wc -l)" -eq 241

      - name: Replace main atomically
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/replacement-tree/. .
          git add -A
          test "$(git write-tree)" = "274d804e491d56063ef3c2e63029c5dad531e091"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: replace repository with SillyTavern Card Studio 1.3.0"
          git push origin main
