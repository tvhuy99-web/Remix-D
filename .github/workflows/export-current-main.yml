name: Apply complete replacement

on:
  push:
    branches:
      - agent/full-replace-upload
    paths:
      - .payload-v6/READY

permissions:
  contents: write

concurrency:
  group: complete-replacement-main
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out replacement carrier branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-replace-upload
          fetch-depth: 0

      - name: Assemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload-v6/part-* | base64 --decode > /tmp/source.tar.zst
          echo "c95bccfffd57a1df83c24a1fa7ffe966746dfa23437c73e5aa8d4211afc5eaf7  /tmp/source.tar.zst" | sha256sum --check
          mkdir -p /tmp/replacement-tree
          tar --zstd -xf /tmp/source.tar.zst -C /tmp/replacement-tree

      - name: Rebuild generated assets
        shell: bash
        working-directory: /tmp/replacement-tree
        run: |
          set -euo pipefail
          npm ci
          npm run build
          zstd --decompress --patch-from=dist/assets/index-B4erEXO1.js \
            .replacement-internal/audit.patch.zst \
            -o audit/blackbox-1.2.0/asset-production.js
          rm -rf node_modules .replacement-internal
          test "$(find . -type f | wc -l)" -eq 241

      - name: Replace main atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/replacement-tree/. .
          git add -A
          test "$(git write-tree)" = "274d804e491d56063ef3c2e63029c5dad531e091"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: replace repository with SillyTavern Card Studio 1.3.0"
          git push origin main
