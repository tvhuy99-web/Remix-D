name: Apply release A full replacement

on:
  push:
    branches:
      - agent/release-a-full-replace
    paths:
      - .release-a/READY

permissions:
  contents: write

concurrency:
  group: release-a-full-replacement
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock operation to expected repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .release-a/READY)" = "replace-main-with-release-A"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          echo "Current main: ${current_main}"
          test "${current_main}" = "46010bf28bf38095b271f9889efab43f7b2f9d67"

      - name: Download ZIP asset from release A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/A"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" > /tmp/release.json

          asset_url="$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))][0].browser_download_url // empty' /tmp/release.json)"
          asset_name="$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))][0].name // empty' /tmp/release.json)"
          test -n "${asset_url}"
          test -n "${asset_name}"
          echo "Downloading release asset: ${asset_name}"
          curl -fL --retry 3 --retry-delay 2 "${asset_url}" -o /tmp/release-a.zip
          unzip -t /tmp/release-a.zip >/dev/null

      - name: Replace working tree with release contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-a-unpacked
          mkdir -p /tmp/release-a-unpacked
          unzip -q /tmp/release-a.zip -d /tmp/release-a-unpacked

          mapfile -t top_entries < <(find /tmp/release-a-unpacked -mindepth 1 -maxdepth 1 -printf '%p\n')
          test "${#top_entries[@]}" -gt 0

          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          else
            source_root="/tmp/release-a-unpacked"
          fi

          test ! -e "${source_root}/.git"
          test -f "${source_root}/package.json"
          test -f "${source_root}/src/components/PromptEditor.tsx"

          git reset --hard origin/main
          git clean -fdx
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${source_root}/." .

      - name: Verify exact target tree and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          tree_sha="$(git write-tree)"
          echo "Generated target tree: ${tree_sha}"
          test "${tree_sha}" = "274d804e491d56063ef3c2e63029c5dad531e091"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_commit="$(printf '%s\n' 'release: replace repository with version 1.3.0' | git commit-tree "${tree_sha}" -p origin/main)"
          echo "Created replacement commit: ${new_commit}"
          git push origin "${new_commit}:refs/heads/main"
