name: Apply full replacement v14

on:
  push:
    branches:
      - agent/full-replace-v14
    paths:
      - .payload-v14/READY

permissions:
  contents: write

concurrency:
  group: full-replacement-v14
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .payload-v14/READY)" = "apply-274d804e491d56063ef3c2e63029c5dad531e091"
          cat .payload-v14/source-*.b64 | base64 --decode > /tmp/source.tar.xz
          base64 --decode .payload-v14/audit.b64 > /tmp/audit.patch.zst
          echo '77ad4f4658b0f6aa519236b72c26e53f8e294a99d425fa6da1d60aa0abe04399  /tmp/source.tar.xz' | sha256sum -c -
          echo 'af39c7962436202834f98667312af77a369720f77b9b3519838be2b7839a0fa9  /tmp/audit.patch.zst' | sha256sum -c -

      - name: Lock replacement to expected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "46010bf28bf38095b271f9889efab43f7b2f9d67"

      - name: Restore exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard origin/main
          git clean -fdx
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/source.tar.xz -C .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Build exact distribution
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/assets/index-B4erEXO1.js
          echo '39ac014e8267a15a4a3545f4c3dc195559c2ce74965e2e04576a2871fa2b014c  dist/assets/index-B4erEXO1.js' | sha256sum -c -

      - name: Restore audit production snapshot
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          mkdir -p audit/blackbox-1.2.0
          zstd --decompress --patch-from=dist/assets/index-B4erEXO1.js /tmp/audit.patch.zst -o audit/blackbox-1.2.0/asset-production.js
          echo '28b5f9fb13ad8856c0cc40ece7e10eb51fb18894841fe53d63935a5828713986  audit/blackbox-1.2.0/asset-production.js' | sha256sum -c -

      - name: Verify and publish one atomic commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          git add -A
          tree_sha="$(git write-tree)"
          echo "Generated tree: ${tree_sha}"
          test "${tree_sha}" = "274d804e491d56063ef3c2e63029c5dad531e091"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: replace repository with version 1.3.0'
          git push origin HEAD:main
