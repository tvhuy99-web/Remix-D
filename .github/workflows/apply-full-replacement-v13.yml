name: Apply full replacement v13

on:
  push:
    branches:
      - agent/full-replace-v13
    paths:
      - .payload-v13/READY

permissions:
  contents: write

concurrency:
  group: full-replace-main-v13
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          path: payload
          fetch-depth: 1

      - name: Checkout locked main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Assemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cd payload/.payload-v13

          mapfile -t parts < <(printf '%s\n' part-[0-9][0-9][0-9] | sort)
          test "${#parts[@]}" -eq 8
          for i in $(seq 0 7); do
            expected=$(printf 'part-%03d' "$i")
            test "${parts[$i]}" = "$expected"
          done

          cat "${parts[@]}" > payload.u15
          test "$(wc -c < payload.u15)" -eq 319737
          echo '115911b82559ed1635da83b93bb258e96d646516e371f53a54604ed52ed91055  payload.u15' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          encoded = Path('payload.u15').read_text(encoding='utf-8')
          assert len(encoded) == 106579
          expected_size = 199835
          accumulator = 0
          bit_count = 0
          decoded = bytearray()

          for char in encoded:
              value = ord(char) - 0x3400
              assert 0 <= value < 32768
              accumulator = (accumulator << 15) | value
              bit_count += 15
              while bit_count >= 8:
                  bit_count -= 8
                  decoded.append((accumulator >> bit_count) & 0xff)
                  accumulator &= (1 << bit_count) - 1 if bit_count else 0

          package = bytes(decoded[:expected_size])
          assert len(package) == expected_size
          Path('payload.bin').write_bytes(package)

          source_size = int.from_bytes(package[:4], 'big')
          assert source_size == 194461
          source_start = 4
          source_end = source_start + source_size
          source = package[source_start:source_end]
          audit = package[source_end:]
          assert len(audit) == 5370
          Path('source.delta.zst').write_bytes(source)
          Path('audit.delta.zst').write_bytes(audit)
          PY

          echo 'a054f48cf2806e6f902fee63eddd473f6668e1a5c2a83e24a6d762e5c20b9bfc  payload.bin' | sha256sum -c -
          echo 'e7440e9b177b0bfdfdabfe70b8498e976620d4537d4c4ea01f49abbf49c0f078  source.delta.zst' | sha256sum -c -
          echo 'af39c7962436202834f98667312af77a369720f77b9b3519838be2b7839a0fa9  audit.delta.zst' | sha256sum -c -

      - name: Reconstruct verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cd work

          expected_base='46010bf28bf38095b271f9889efab43f7b2f9d67'
          expected_base_tree='6029c0c9f63f53476a47fa8444fe22ab16a5d6af'
          test "$(git rev-parse HEAD)" = "$expected_base"
          test "$(git rev-parse HEAD^{tree})" = "$expected_base_tree"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --format=gnu --exclude='./.git' -cf ../base.tar .
          echo 'cb6abd1e493eb3a60c6b6eab86358f24d7879be245568c92edd5148faab3dd70  ../base.tar' | sha256sum -c -

          zstd -q -d --patch-from=../base.tar ../payload/.payload-v13/source.delta.zst -o ../source.tar
          echo '73ad249f1b70e6d1ad7fc7b21f28b01dd6aecd5622f1313da711acf9b9ef5de9  ../source.tar' | sha256sum -c -

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf ../source.tar

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Build deterministic release assets
        shell: bash
        run: |
          set -euo pipefail
          cd work
          npm ci
          npm run build
          echo 'cd9316d3fac0535f81642e68b87b67423c40c639e60f5a5f174d75b69ef6c865  dist/assets/index-B4erEXO1.js' | sha256sum -c -

          zstd -q -d --patch-from=dist/assets/index-B4erEXO1.js ../payload/.payload-v13/audit.delta.zst -o audit/blackbox-1.2.0/asset-production.js
          echo '78bf3ab4d10a890da795b3b116b1ee70ff56aaad4c1500d38b6eb0ebb73a27a5  audit/blackbox-1.2.0/asset-production.js' | sha256sum -c -

      - name: Commit only the exact target tree
        shell: bash
        run: |
          set -euo pipefail
          cd work

          expected_tree='274d804e491d56063ef3c2e63029c5dad531e091'
          rm -rf node_modules
          git add -A
          git add -f dist audit/blackbox-1.2.0/asset-production.js

          actual_tree=$(git write-tree)
          test "$actual_tree" = "$expected_tree"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: replace main with verified Card Studio 1.3.0 source'
          test "$(git show -s --format=%T HEAD)" = "$expected_tree"

          git push origin HEAD:main
