name: Apply release A replacement on main

on:
  push:
    branches:
      - main
    paths:
      - .release-a-main/READY
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-a-main-replacement
  cancel-in-progress: false

jobs:
  replace-main:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report workflow start
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title='Release A replacement status' \
            -f body="Workflow started for commit ${GITHUB_SHA}. It will download the attached archive from release A, verify target tree 274d804e491d56063ef3c2e63029c5dad531e091, and replace main." \
            --jq '.number')"
          echo "STATUS_ISSUE=${issue_number}" >> "${GITHUB_ENV}"

      - name: Verify trigger and lock main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "$(cat .release-a-main/READY)" = "replace-main-with-release-A-v3"
          fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Resolve and download the release archive
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/A" > /tmp/release.json

          asset_list="$(jq -r '.assets[]? | "- \(.name) (\(.size) bytes)"' /tmp/release.json)"
          if [ -z "${asset_list}" ]; then
            gh issue comment "${STATUS_ISSUE}" --body "Release A currently has no attached assets. The auto-generated Source code downloads are not the uploaded version 1.3.0 ZIP."
            exit 1
          fi
          printf 'Release assets:\n%s\n' "${asset_list}"

          preferred='SillyTavern-Card-Studio-1.3.0-preset-heading-fix.zip'
          asset_record="$(jq -r --arg preferred "${preferred}" '
            ((.assets | map(select(.name == $preferred)) | .[0]) // (.assets | sort_by(.size) | reverse | .[0]))
            | select(. != null)
            | [.name, .browser_download_url, (.size | tostring)]
            | @tsv
          ' /tmp/release.json)"
          test -n "${asset_record}"
          IFS=$'\t' read -r asset_name asset_url asset_size <<< "${asset_record}"
          echo "Downloading ${asset_name} (${asset_size} bytes)"
          curl -fL --retry 3 --retry-delay 2 "${asset_url}" -o /tmp/release-a.zip
          test "$(stat -c '%s' /tmp/release-a.zip)" = "${asset_size}"
          unzip -t /tmp/release-a.zip >/dev/null

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-a-unpacked
          mkdir -p /tmp/release-a-unpacked
          unzip -q /tmp/release-a.zip -d /tmp/release-a-unpacked

          mapfile -t top_entries < <(find /tmp/release-a-unpacked -mindepth 1 -maxdepth 1 -printf '%p\n')
          test "${#top_entries[@]}" -gt 0
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_root="${top_entries[0]}"
          else
            source_root="/tmp/release-a-unpacked"
          fi

          test ! -e "${source_root}/.git"
          test -f "${source_root}/package.json"
          test -f "${source_root}/src/components/PromptEditor.tsx"

          git reset --hard "${GITHUB_SHA}"
          git clean -fdx
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${source_root}/." .

      - name: Verify exact tree and publish one commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          tree_sha="$(git write-tree)"
          echo "Generated target tree: ${tree_sha}"
          test "${tree_sha}" = "274d804e491d56063ef3c2e63029c5dad531e091"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_commit="$(printf '%s\n' 'release: replace repository with version 1.3.0' | git commit-tree "${tree_sha}" -p "${GITHUB_SHA}")"
          echo "Replacement commit: ${new_commit}"
          git push origin "${new_commit}:refs/heads/main"
          echo "REPLACEMENT_COMMIT=${new_commit}" >> "${GITHUB_ENV}"

      - name: Report success
        if: success()
        shell: bash
        run: |
          gh issue comment "${STATUS_ISSUE}" --body "Replacement succeeded. Main now points to commit ${REPLACEMENT_COMMIT}, with verified tree 274d804e491d56063ef3c2e63029c5dad531e091."
          gh issue close "${STATUS_ISSUE}" --reason completed

      - name: Report failure
        if: failure() && env.STATUS_ISSUE != ''
        shell: bash
        run: |
          gh issue comment "${STATUS_ISSUE}" --body "Replacement failed in workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Main was not replaced by the target tree."
